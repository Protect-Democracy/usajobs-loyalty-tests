name: Daily Data Update

on:
  schedule:
    # Run daily at 2 AM EST (7 AM UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:  # Allow manual trigger

# Needed for pushing changes back to repo and creating PRs
permissions:
  contents: write
  issues: write
  pull-requests: write

# Node 20 runs out of stack walking the 120k-file workspace; opt into Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour timeout for data update
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Need full history for git operations
        lfs: true  # Pull Git LFS files
        ref: main  # Always start from main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

    - name: Create or switch to data-updates branch
      run: |
        # Fetch all branches
        git fetch origin
        
        # Always start from main for a clean state
        git checkout main
        git pull origin main
        
        # Create a fresh data-updates branch from main
        # This ensures we always have the latest code and data
        git checkout -B data-updates
        echo "Created fresh data-updates branch from main"

    - name: Pull Git LFS files
      run: |
        git lfs pull
        echo "Checking data files:"
        ls -lh data/*.parquet | head -5

    - name: Check for api key
      id: key_check
      run: |
        if [ "${{ secrets.USAJOBS_API_TOKEN }}" != '' ]; then
          echo "USAJobs Api Key found."
        else
          echo "Data collection requires a USAJobs Api Key!"
          exit 1
        fi

    - name: Run daily data update
      if: steps.key_check.outcome == 'success'
      env:
        USAJOBS_API_TOKEN: ${{ secrets.USAJOBS_API_TOKEN }}
        GITHUB_ACTIONS: true
      run: |
        cd src/generate_data
        python run_data_pipeline.py

    - name: Check for Current API warning
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const warningFile = 'logs/CURRENT_API_EMPTY_WARNING.txt';

          if (fs.existsSync(warningFile)) {
            const content = fs.readFileSync(warningFile, 'utf8');
            console.log('Warning: Current API returned 0 jobs!');

            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = 'The USAJobs Current API returned 0 jobs during the daily update.\n\n' +
              'This may indicate:\n' +
              '- An API authentication issue\n' +
              '- An API outage\n' +
              '- A configuration problem\n\n' +
              '**Warning file contents:**\n```\n' + content + '\n```\n\n' +
              '[View the workflow run](' + runUrl + ')';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Current API Empty - ' + today,
              body: body,
              labels: ['bug', 'automated'],
              assignees: ['abigailhaddad-2'],
            });

            fs.unlinkSync(warningFile);
          }

    - name: Check for pagination cap hits (500 / 10,000)
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const capFile = 'logs/CAP_HIT_WARNING.txt';

          if (fs.existsSync(capFile)) {
            const content = fs.readFileSync(capFile, 'utf8');
            console.log('Warning: a collection hit an exact pagination cap!');

            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = '## Pagination Cap Hit (exactly 500 or 10,000)\n\n' +
              'A collection returned a count that lands *exactly* on a known page-size (500) ' +
              'or max-results (10,000) boundary. That is the classic signature of pagination ' +
              'silently stopping early — the numbers for the affected query may be truncated.\n\n' +
              '**Affected fetches:**\n```\n' + content + '\n```\n\n' +
              '**Action:** Confirm whether the real total actually equals that number (a rare ' +
              'coincidence) or whether pagination broke and the data needs re-collecting.\n\n' +
              '[View the workflow run](' + runUrl + ')';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Pagination Cap Hit - ' + today,
              body: body,
              labels: ['bug', 'automated'],
              assignees: ['abigailhaddad-2'],
            });

            fs.unlinkSync(capFile);
          }

    - name: Run data integrity tests
      id: data_tests
      run: |
        cd src/generate_data
        python test_data_integrity.py
        # If tests fail, the script returns non-zero and this step will fail

    - name: Commit and push to data-updates branch
      # Only runs if tests pass
      run: |
        # Check if there are changes
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "Daily data update - $(date +'%Y-%m-%d')"
          git push -f origin data-updates
          echo "CHANGES_MADE=true" >> $GITHUB_ENV
        else
          echo "No changes to commit"
          echo "CHANGES_MADE=false" >> $GITHUB_ENV
        fi

    - name: Create Pull Request
      if: env.CHANGES_MADE == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # ensure_pr retries and re-checks state between attempts. A bare
        # `gh pr create` fails the whole run on a transient GitHub 5xx even
        # when the PR was created — that happened on 2026-07-29.
        source .github/scripts/gh_api_retry.sh
        ensure_pr data-updates \
          "Daily data update - $(date +'%Y-%m-%d')" \
          "Automated daily data update from USAJobs API"

    - name: Auto-merge PR if tests pass
      if: env.CHANGES_MADE == 'true' && steps.data_tests.outcome == 'success'
      run: |
        source .github/scripts/gh_api_retry.sh

        # Wait a moment for PR to be created
        sleep 10

        # Find the PR number
        PR_NUMBER=$(gh pr list --base main --head data-updates --json number --jq '.[0].number')

        if [ -n "$PR_NUMBER" ]; then
          echo "Auto-merging PR #$PR_NUMBER"
          merge_pr "$PR_NUMBER" --merge --auto
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check for failures
      if: failure() || (env.CHANGES_MADE == 'true' && steps.data_tests.outcome == 'failure')
      uses: actions/github-script@v7
      with:
        script: |
          const issue = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Daily Data Update Failed - ${new Date().toISOString().split('T')[0]}`,
            body: `The daily data update workflow had issues. 
            
            ${context.job.status === 'failure' ? 'The workflow failed to complete.' : 'Tests failed but a PR was created.'}
            
            Test Results:
            - Data Integrity Tests: ${{ steps.data_tests.outcome }}
            
            [View the workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            
            Please check the logs for details.`,
            labels: ['bug', 'automated']
          };
          await github.rest.issues.create(issue);
