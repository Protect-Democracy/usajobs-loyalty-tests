name: Daily Questionnaire Analysis

on:
  schedule:
    # Run daily at 4 AM EST (9 AM UTC) - 2 hours after data update
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual trigger


# Needed for pushing changes back to repo, creating PRs, and
# dispatching the deploy workflow at the end.
permissions:
  contents: write
  id-token: write
  pull-requests: write
  actions: write
  issues: write  # open a tracking issue if the run fails

# Node 20 runs out of stack walking the 120k-file workspace; opt into Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-questionnaires:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # Near-max (6h) for questionnaire analysis; hosted-runner hard cap is 360
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        lfs: true  # Pull Git LFS files
        ref: main  # Always start from main

    - name: Create or switch to questionnaire-updates branch
      run: |
        # Fetch all branches
        git fetch origin
        
        # Always start from main for a clean state
        git checkout main
        git pull origin main
        
        # Create a fresh questionnaire-updates branch from main
        # This ensures we always have the latest code and data
        git checkout -B questionnaire-updates
        echo "Created fresh questionnaire-updates branch from main"
        
        git lfs pull
        echo "Verifying data files:"
        ls -lh data/*.parquet | head -5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
        # Install Playwright
        pip install playwright
        playwright install chromium
        playwright install-deps

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

    - name: Run questionnaire analysis
      timeout-minutes: 330  # 5.5 hour timeout for scraping
      env:
        GITHUB_ACTIONS: true
      run: |
        cd src/generate_site
        python run_questionnaire_pipeline.py
      continue-on-error: true  # Don't fail the workflow if scraping times out

    - name: Ensure website JSON is regenerated
      if: always()  # run even if a prior step failed or timed out
      run: |
        cd src/generate_site
        python generate_website_json.py
        SIZE=$(stat -c%s ../public/analysis_data.json)
        if [ "$SIZE" -lt 10000 ]; then
          echo "ERROR: src/public/analysis_data.json is suspiciously small ($SIZE bytes)"
          exit 1
        fi
        echo "analysis_data.json regenerated ($SIZE bytes)"

    - name: Run questionnaire tests
      id: questionnaire_tests
      run: |
        cd src/generate_site
        python test_questionnaire_artifacts.py
        # If tests fail, this step will fail and stop the workflow

    - name: Commit and push to questionnaire-updates branch
      # Only commit if tests passed
      run: |
        # Check if there are changes
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "Update questionnaire analysis - $(date +'%Y-%m-%d')"
          git push -f origin questionnaire-updates
          echo "CHANGES_MADE=true" >> $GITHUB_ENV
          echo "✅ Committed changes to questionnaire-updates branch"
        else
          echo "ℹ️  No changes to commit"
          echo "CHANGES_MADE=false" >> $GITHUB_ENV
        fi

    - name: Create Pull Request
      if: env.CHANGES_MADE == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # ensure_pr retries and re-checks state between attempts. A bare
        # `gh pr create` fails the whole run on a transient GitHub 5xx even
        # when the PR was created — that happened on 2026-07-29.
        source .github/scripts/gh_api_retry.sh
        ensure_pr questionnaire-updates \
          "Questionnaire analysis update - $(date +'%Y-%m-%d')" \
          "Automated questionnaire analysis update"

    - name: Merge PR and dispatch deploy
      if: env.CHANGES_MADE == 'true' && steps.questionnaire_tests.outcome == 'success'
      run: |
        source .github/scripts/gh_api_retry.sh

        # Wait a moment for the PR to be created in the previous step
        sleep 10

        PR_NUMBER=$(gh pr list --base main --head questionnaire-updates --json number --jq '.[0].number')
        if [ -z "$PR_NUMBER" ]; then
          echo "No open PR found — nothing to merge or deploy."
          exit 0
        fi

        echo "Merging PR #$PR_NUMBER"
        # Use --merge (not --merge --auto) so the merge is synchronous;
        # we want main to actually have the new commit before we dispatch
        # the deploy. --admin bypasses any branch-protection checks.
        # merge_pr treats an already-merged PR as success, so a transient
        # 5xx that lands after the merge can't fail the run.
        merge_pr "$PR_NUMBER" --merge --admin

        # Pushes made by GITHUB_TOKEN don't trigger other workflows'
        # `push` events, so deploy-site.yml's push trigger won't fire
        # for the merge above. Explicitly dispatch it instead — that
        # path is allowed even from GITHUB_TOKEN and keeps deploy-site.yml
        # as the single source of truth for deployments.
        echo "Dispatching deploy-site.yml"
        # Safe to repeat: a duplicate deploy is harmless, a missed one leaves
        # the site stale with nothing to indicate it.
        gh_retry gh workflow run deploy-site.yml --ref main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Open an issue if the run failed
      # Mirrors daily-data-update.yml. Fires on any job failure — the
      # most common is the push to questionnaire-updates being rejected
      # (e.g. a generated file exceeding GitHub's 100 MB limit), which
      # otherwise fails silently and freezes the site's data.
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Daily Questionnaire Analysis Failed - ${new Date().toISOString().split('T')[0]}`,
            body: `The daily questionnaire analysis workflow failed, so the site's questionnaire data did not update.

            Questionnaire tests: ${{ steps.questionnaire_tests.outcome }}

            Common cause: the push to \`questionnaire-updates\` was rejected because a generated file (e.g. \`src/public/analysis_data.json\`) exceeded GitHub's 100 MB limit. Check the log's push step.

            [View the workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            labels: ['bug', 'automated'],
          });
