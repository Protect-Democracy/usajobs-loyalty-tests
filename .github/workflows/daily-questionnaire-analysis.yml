name: Daily Questionnaire Analysis

on:
  schedule:
    # Run daily at 4 AM EST (9 AM UTC) - 2 hours after data update
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual trigger


# Needed for pushing changes back to repo and creating PRs
permissions:
  contents: write
  id-token: write
  pull-requests: write

# Node 20 runs out of stack walking the 120k-file workspace; opt into Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-questionnaires:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # Near-max (6h) for questionnaire analysis; hosted-runner hard cap is 360
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        lfs: true  # Pull Git LFS files
        ref: main  # Always start from main

    - name: Create or switch to questionnaire-updates branch
      run: |
        # Fetch all branches
        git fetch origin
        
        # Always start from main for a clean state
        git checkout main
        git pull origin main
        
        # Create a fresh questionnaire-updates branch from main
        # This ensures we always have the latest code and data
        git checkout -B questionnaire-updates
        echo "Created fresh questionnaire-updates branch from main"
        
        git lfs pull
        echo "Verifying data files:"
        ls -lh data/*.parquet | head -5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
        # Install Playwright
        pip install playwright
        playwright install chromium
        playwright install-deps

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

    - name: Run questionnaire analysis
      timeout-minutes: 330  # 5.5 hour timeout for scraping
      env:
        GITHUB_ACTIONS: true
      run: |
        cd src/generate_site
        python run_questionnaire_pipeline.py
      continue-on-error: true  # Don't fail the workflow if scraping times out

    - name: Ensure website JSON is regenerated
      if: always()  # run even if a prior step failed or timed out
      run: |
        cd src/generate_site
        python generate_website_json.py
        SIZE=$(stat -c%s ../public/analysis_data.json)
        if [ "$SIZE" -lt 10000 ]; then
          echo "ERROR: src/public/analysis_data.json is suspiciously small ($SIZE bytes)"
          exit 1
        fi
        echo "analysis_data.json regenerated ($SIZE bytes)"

    - name: Run questionnaire tests
      id: questionnaire_tests
      run: |
        cd src/generate_site
        python test_questionnaire_artifacts.py
        # If tests fail, this step will fail and stop the workflow

    - name: Commit and push to questionnaire-updates branch
      # Only commit if tests passed
      run: |
        # Check if there are changes
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "Update questionnaire analysis - $(date +'%Y-%m-%d')"
          git push -f origin questionnaire-updates
          echo "CHANGES_MADE=true" >> $GITHUB_ENV
          echo "✅ Committed changes to questionnaire-updates branch"
        else
          echo "ℹ️  No changes to commit"
          echo "CHANGES_MADE=false" >> $GITHUB_ENV
        fi

    - name: Create Pull Request
      if: env.CHANGES_MADE == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Check if PR already exists
        PR_EXISTS=$(gh pr list --base main --head questionnaire-updates --state open --json number --jq length)
        
        if [ "$PR_EXISTS" -eq "0" ]; then
          echo "Creating new PR..."
          gh pr create \
            --base main \
            --head questionnaire-updates \
            --title "Questionnaire analysis update - $(date +'%Y-%m-%d')" \
            --body "Automated questionnaire analysis update"
        else
          echo "PR already exists, skipping creation"
        fi

    - name: Merge PR and dispatch deploy
      if: env.CHANGES_MADE == 'true' && steps.questionnaire_tests.outcome == 'success'
      run: |
        # Wait a moment for the PR to be created in the previous step
        sleep 10

        PR_NUMBER=$(gh pr list --base main --head questionnaire-updates --json number --jq '.[0].number')
        if [ -z "$PR_NUMBER" ]; then
          echo "No open PR found — nothing to merge or deploy."
          exit 0
        fi

        echo "Merging PR #$PR_NUMBER"
        # Use --merge (not --merge --auto) so the merge is synchronous;
        # we want main to actually have the new commit before we dispatch
        # the deploy. --admin bypasses any branch-protection checks.
        gh pr merge "$PR_NUMBER" --merge --admin

        # Pushes made by GITHUB_TOKEN don't trigger other workflows'
        # `push` events, so deploy-site.yml's push trigger won't fire
        # for the merge above. Explicitly dispatch it instead — that
        # path is allowed even from GITHUB_TOKEN and keeps deploy-site.yml
        # as the single source of truth for deployments.
        echo "Dispatching deploy-site.yml"
        gh workflow run deploy-site.yml --ref main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
