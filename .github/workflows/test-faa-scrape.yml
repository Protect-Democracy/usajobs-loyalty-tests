name: Test FAA Questionnaire Discovery (manual, read-only)

# One-off manual test for the fix-faa-questionnaire-discovery branch. Confirms
# GitHub Actions' network can reach jobs.faa.gov and that the new discovery
# fallback + scraper actually recover a Loyalty Q questionnaire, without any
# of daily-questionnaire-analysis.yml's commit/merge/deploy side effects.
# Safe to delete once the fix is verified and merged.

on:
  workflow_dispatch:

jobs:
  test-faa-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Test discovery + scrape against a known FAA posting
        run: |
          cd src/generate_site
          python3 - <<'EOF'
          import sys
          from questionnaire_utils import discover_questionnaire_url_from_usajobs_posting
          from extract_questionnaires import scrape_questionnaire

          position_uri = 'https://www.usajobs.gov:443/job/884123900'
          print(f'Discovering questionnaire URL from {position_uri} ...')
          url = discover_questionnaire_url_from_usajobs_posting(position_uri)
          print(f'Discovered URL: {url}')
          if not url:
              print('FAIL: no URL discovered')
              sys.exit(1)

          print(f'\nScraping {url} ...')
          content = scrape_questionnaire(url, '/tmp/faa_test_output', timeout_seconds=60)
          if not content:
              print('FAIL: scrape returned no content (network reachability or rendering issue)')
              sys.exit(1)

          print(f'Scraped {len(content)} chars')
          print(content[:2000])

          eo_phrase = "How would you help advance the President's Executive Orders and policy priorities in this role?"
          print(f'\nContains Loyalty Q: {eo_phrase in content}')
          EOF
