name: Scrape inferred questionnaires (chained)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write       # self-dispatch the next link in the chain
  pull-requests: write # open the merge PR when the queue drains

# Node 20 runs out of stack walking the 120k-file workspace after the overlay
# step; opt into Node 24 (GH's announced default) which has a larger stack.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Only one chain running at a time; do not cancel in-progress work.
concurrency:
  group: scrape-inferred-questionnaires
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # hard cap; script self-limits to 270 min

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull branch artifacts (CSV, raw files, known-bad) on top of main
        run: |
          set -e
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git fetch origin inferred-questionnaires || true
          if git rev-parse --verify origin/inferred-questionnaires >/dev/null 2>&1; then
            # Copy accumulated artifacts from the branch into the working tree.
            # We only touch files the scrape produces — parquet/code stays from main.
            git checkout origin/inferred-questionnaires -- \
              src/generate_site/questionnaire_links.csv \
              src/generate_site/questionnaire_known_bad.txt \
              src/generate_site/raw_questionnaires 2>/dev/null || true
            echo "Pulled prior artifacts from inferred-questionnaires branch"
          else
            echo "No inferred-questionnaires branch yet — this is the first run"
          fi
          ls src/generate_site/raw_questionnaires/ 2>/dev/null | wc -l || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests playwright
          playwright install chromium

      - name: Extract links and scrape (budgeted)
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          cd src/generate_site
          # --max-time gives the script a graceful-shutdown budget (minutes).
          # 270 min = 4.5h, well under the 330-min job cap.
          python extract_questionnaires.py --max-time 270 --workers 3

      - name: Commit scrape artifacts to inferred-questionnaires
        id: commit
        run: |
          set -e
          # Start from a clean branch head based on origin/main, then stage
          # only the scrape-produced files from the working tree.
          git checkout -B inferred-questionnaires
          git add -f \
            src/generate_site/raw_questionnaires/ \
            src/generate_site/questionnaire_links.csv \
            src/generate_site/questionnaire_known_bad.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "Nothing new to commit."
          else
            git commit -m "Scrape inferred questionnaires — $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push -f origin inferred-questionnaires
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Count remaining URLs
        id: queue
        run: |
          cd src/generate_site
          python - <<'PY'
          import os, pandas as pd
          from questionnaire_utils import (
              get_questionnaire_filepath, load_known_bad_urls, transform_monster_url,
          )
          df = pd.read_csv('questionnaire_links.csv')
          bad = load_known_bad_urls()
          remaining = 0
          for url in df['questionnaire_url']:
              if url in bad:
                  continue
              path = get_questionnaire_filepath(transform_monster_url(url))
              if not path.exists():
                  remaining += 1
          print(f'Remaining to scrape: {remaining:,}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'remaining={remaining}\n')
          PY

      - name: Write run summary
        run: |
          {
            echo '## Chained inferred-questionnaire scrape'
            echo ''
            echo "- Changes committed this run: **${{ steps.commit.outputs.no_changes == 'false' && 'yes' || 'no' }}**"
            echo "- URLs still to scrape: **${{ steps.queue.outputs.remaining }}**"
            echo "- Branch: \`inferred-questionnaires\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Self-dispatch next link if queue is non-empty
        if: steps.queue.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching next run — ${{ steps.queue.outputs.remaining }} URLs remaining"
          gh workflow run scrape-inferred-questionnaires.yml --ref main

      - name: Open merge PR when the chain is done
        if: steps.queue.outputs.remaining == '0' && steps.commit.outputs.no_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Re-use an existing open PR if present; else create one.
          PR=$(gh pr list --base main --head inferred-questionnaires --state open --json number --jq '.[0].number // ""')
          if [ -z "$PR" ]; then
            gh pr create \
              --base main \
              --head inferred-questionnaires \
              --title "Scrape inferred questionnaires — chain complete" \
              --body "Automated PR from the chained inferred-questionnaire scrape. Queue is empty."
            PR=$(gh pr list --base main --head inferred-questionnaires --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$PR" --merge --auto
