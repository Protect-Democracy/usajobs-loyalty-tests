name: Deploy site to Netlify

# Pushes the current src/public/analysis_data.json on main to Netlify
# without re-running the multi-hour analyze pipeline.
#
# Fires on every push to main rather than path-filtering on
# src/public/**. An earlier attempt at path-filtering missed daily-
# analysis merge commits: GitHub's path filter evaluated the merge
# commit (whose file list is a subset relative to its parents) and
# didn't see analysis_data.json as changed, even though it was
# changed in the interior commit. Running this ~1-min deploy on
# every push to main is cheap and removes that failure mode.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Deploy to Netlify
        uses: jsmrcaga/action-netlify-deploy@v2.4.0
        with:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_DEPLOY_MESSAGE: "Deployed from GitHub action (deploy-site.yml)"
          NETLIFY_DEPLOY_TO_PROD: true
          install_command: "echo Skipping installing the dependencies"
          build_command: "echo Skipping building the web files"
          build_directory: "src/public"
