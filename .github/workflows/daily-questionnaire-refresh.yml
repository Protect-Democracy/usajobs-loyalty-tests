name: Daily Open Questionnaire Refresh

# Re-fetches the questionnaire for every currently-open posting and records
# what it says now under src/generate_site/questionnaire_rechecks/ (see
# refresh_open_questionnaires.py). raw_questionnaires/ only has each
# questionnaire as first scraped, and agencies edit them after posting.
#
# Runs after Daily Questionnaire Analysis finishes (that workflow merges its
# own PR, so main then has the day's postings and questionnaire links).

on:
  workflow_run:
    workflows: ["Daily Questionnaire Analysis"]
    types: [completed]
  workflow_dispatch:
  # Test runs from the feature branch: the refresh runs but nothing is committed.
  push:
    branches: [loyalty-q-rechecks]
    paths:
      - src/generate_site/refresh_open_questionnaires.py
      - .github/workflows/daily-questionnaire-refresh.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: questionnaire-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # A failed analysis run still leaves main with yesterday's data, which is
    # fine to refresh against, so run on any completed analysis.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Refresh open questionnaires
        run: |
          cd src/generate_site
          python refresh_open_questionnaires.py

      - name: Commit, open PR, and merge
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout -B questionnaire-refresh
          git add src/generate_site/questionnaire_rechecks
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh open questionnaires - $(date -u +%F)"
          git push -f origin questionnaire-refresh

          source .github/scripts/gh_api_retry.sh
          ensure_pr questionnaire-refresh \
            "Open questionnaire refresh - $(date -u +%F)" \
            "Automated daily re-fetch of every open posting's questionnaire."
          sleep 10
          PR_NUMBER=$(gh pr list --base main --head questionnaire-refresh --json number --jq '.[0].number')
          merge_pr "$PR_NUMBER" --merge --admin

      - name: Open an issue if the run failed
        if: failure() && github.event_name != 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Open Questionnaire Refresh Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `The daily open-questionnaire refresh failed, so questionnaire_rechecks/ was not updated. If the log says only a small share of fetches succeeded, USAStaffing may be blocking the runner; the previous state was kept.

            [View the workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'automated'],
              assignees: ['abigailhaddad-2'],
            });
